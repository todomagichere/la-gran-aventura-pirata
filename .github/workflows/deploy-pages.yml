name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare optimized site artifact
        run: |
          mkdir _site
          rsync -a \
            --no-owner \
            --no-group \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'compose.yaml' \
            --exclude 'Dockerfile' \
            --exclude 'nginx.conf' \
            --exclude 'package.json' \
            --exclude 'README.md' \
            --exclude 'src/assets/bota-pirata-realista.webp' \
            --exclude 'src/assets/cofre-pirata-realista.webp' \
            --exclude 'src/assets/iconos-piratas-reales.webp' \
            --exclude 'src/assets/mapa_del_tesoro.webp' \
            --exclude 'src/assets/moneda-pirata-realista.webp' \
            --exclude 'src/assets/parejas-oceano-sprite.webp' \
            --exclude 'src/assets/pergamino-laterales-transparentes.webp' \
            --exclude 'src/assets/pergamino_transparente.webp' \
            --exclude 'src/assets/ruta-casa.webp' \
            --exclude 'src/assets/ruta-tesoro-x.webp' \
            ./ _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
